name: tmp-douyin-secondhop-visual

on:
  push:
    branches:
      - tmp/douyin-visual-discovery-20260817

permissions:
  contents: read

jobs:
  secondhop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install 'git+https://github.com/Johnserf-Seed/f2.git@main' playwright pillow httpx
          python -m playwright install --with-deps chromium
      - name: Build second-hop visual graph
        run: |
          python - <<'PY'
          import asyncio, json, traceback, re
          from pathlib import Path
          from collections import defaultdict
          from io import BytesIO
          import httpx
          from PIL import Image, ImageOps, ImageDraw
          from playwright.async_api import async_playwright
          from f2.apps.douyin.handler import DouyinHandler

          seeds={
            '心理课_关系暴躁':'7571530217895940718',
            '心理课_高敏感':'7585667654859148571',
            '心理课_情感虚无':'7569678142312492915',
            '灯下黑_成长疼痛':'7650511381264420134',
            '灯下黑_空心病':'7657963840063163690',
            '灯下黑_长期主义':'7654900522868083974',
            '心知说_婴儿想什么':'7658235611749073882',
          }
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0'
          root=Path('secondhop'); root.mkdir(exist_ok=True)
          out={'seeds':seeds,'related':{},'authors':{},'errors':[]}

          async def get_cookie():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
              c=await b.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1000})
              pg=await c.new_page()
              try: await pg.goto('https://www.douyin.com/',wait_until='domcontentloaded',timeout=60000)
              except Exception: pass
              await pg.wait_for_timeout(8000)
              cs=await c.cookies(); await b.close()
              return '; '.join(f"{x['name']}={x['value']}" for x in cs if x.get('name'))

          def first_url(obj):
            if not isinstance(obj,dict): return None
            xs=obj.get('url_list') or []
            return xs[0] if xs else None

          def flatten(raw):
            if isinstance(raw,list): return [x for x in raw if isinstance(x,dict)]
            if not isinstance(raw,dict): return []
            for k in ('aweme_list','aweme_data_list','data'):
              if isinstance(raw.get(k),list): return [x for x in raw[k] if isinstance(x,dict)]
            return []

          def norm(x):
            a=x.get('author') or {}; s=x.get('statistics') or {}; v=x.get('video') or {}
            return {
              'aweme_id':str(x.get('aweme_id') or ''),'desc':x.get('desc') or '',
              'nickname':a.get('nickname') or '','sec_uid':a.get('sec_uid') or '',
              'unique_id':a.get('unique_id') or '','signature':a.get('signature') or '',
              'likes':s.get('digg_count'),'comments':s.get('comment_count'),'collects':s.get('collect_count'),'shares':s.get('share_count'),
              'cover':first_url(v.get('cover')) or first_url(v.get('origin_cover')) or first_url(v.get('dynamic_cover')),
            }

          async def main():
            ck=await get_cookie()
            h=DouyinHandler({'headers':{'User-Agent':UA,'Referer':'https://www.douyin.com/'},'proxies':{'http://':None,'https://':None},'timeout':1,'cookie':ck})
            authors=defaultdict(lambda:{'nickname':'','sec_uid':'','unique_id':'','signature':'','seed_hits':set(),'videos':[]})
            all_items=[]
            for label,aid in seeds.items():
              arr=[]; seen=set()
              try:
                async for batch in h.fetch_related_videos(aid,'',20,30):
                  try: raw=batch._to_raw()
                  except Exception:
                    try: raw=batch._to_dict()
                    except Exception: raw=None
                  xs=flatten(raw)
                  for x in xs:
                    n=norm(x)
                    if not n['aweme_id'] or n['aweme_id'] in seen: continue
                    seen.add(n['aweme_id']); n['seed']=label; arr.append(n); all_items.append(n)
                    key=n['sec_uid'] or n['nickname']
                    if key:
                      aa=authors[key]
                      for fld in ('nickname','sec_uid','unique_id','signature'):
                        if n.get(fld): aa[fld]=n[fld]
                      aa['seed_hits'].add(label); aa['videos'].append(n)
                  if len(arr)>=30: break
              except Exception as e:
                out['errors'].append(f'{label}: {type(e).__name__}: {e}')
              out['related'][label]=arr
              print('\n###',label,len(arr))
              for n in arr[:12]: print(n['nickname'],n['likes'],n['desc'][:90])

            for k,a in authors.items():
              a['seed_hits']=sorted(a['seed_hits']); out['authors'][k]=a
            ranked=sorted(authors.values(),key=lambda a:(len(a['seed_hits']),max([v.get('likes') or 0 for v in a['videos']] or [0]),len(a['videos'])),reverse=True)
            print('\n=== AUTHORS ===')
            for a in ranked[:80]:
              print(len(a['seed_hits']),a['nickname'],a['unique_id'],max([v.get('likes') or 0 for v in a['videos']] or [0]),a['signature'][:60])

            # Visual sheets per seed; one cover per unique related video.
            with httpx.Client(headers={'User-Agent':UA,'Referer':'https://www.douyin.com/'},timeout=30,follow_redirects=True) as client:
              for label,arr in out['related'].items():
                thumbs=[]; visual_meta=[]
                for i,n in enumerate(arr[:24]):
                  if not n.get('cover'): continue
                  try:
                    r=client.get(n['cover']); r.raise_for_status()
                    im=Image.open(BytesIO(r.content)).convert('RGB'); im=ImageOps.fit(im,(270,480))
                    dr=ImageDraw.Draw(im); dr.rectangle((0,0,270,58),fill='black');
                    dr.text((5,4),f'{i+1} {n["nickname"][:12]}',fill='white'); dr.text((5,27),f'likes:{n.get("likes")}',fill='white')
                    thumbs.append(im); visual_meta.append(n)
                  except Exception as e: pass
                if thumbs:
                  cols=4; rows=(len(thumbs)+3)//4
                  sheet=Image.new('RGB',(cols*270,rows*480),'black')
                  for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*270,(i//4)*480))
                  safe=re.sub(r'[^\w\u4e00-\u9fff-]+','_',label)
                  sheet.save(root/f'sheet_{safe}.jpg',quality=82)
                  (root/f'meta_{safe}.json').write_text(json.dumps(visual_meta,ensure_ascii=False,indent=2),encoding='utf-8')
            (root/'graph.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-secondhop-visual
          path: secondhop/
          if-no-files-found: warn
