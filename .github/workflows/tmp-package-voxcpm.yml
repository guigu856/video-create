name: tmp-package-voxcpm
on:
  push:
    branches: [tmp/voxcpm-package-20260818]
permissions:
  contents: write
jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[skip package]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save run id
        run: |
          mkdir -p output/voxcpm-package
          echo '${{ github.run_id }}' > output/voxcpm-package/run_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voxcpm-ggbond-audition
          path: output/voxcpm-cpu2/ggbond_question_clone.wav
          retention-days: 7
      - name: Commit run id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-package/run_id.txt
          git commit -m 'chore: save package run id [skip package]' || true
          git push || true
