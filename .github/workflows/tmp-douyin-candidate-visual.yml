name: tmp-douyin-candidate-visual

on:
  push:
    branches:
      - tmp/douyin-account-research-20260817

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install 'git+https://github.com/Johnserf-Seed/f2.git@main' playwright pillow httpx
          python -m playwright install --with-deps chromium
      - name: Collect candidate covers
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from collections import OrderedDict
          import httpx
          from PIL import Image, ImageOps, ImageDraw
          from io import BytesIO
          from playwright.async_api import async_playwright
          from f2.apps.douyin.handler import DouyinHandler

          candidates=OrderedDict([
            ('心知说','MS4wLjABAAAAwrcE-frPfmGAzQXLxm9UHp2DWR5vjvp6Xa5eLVlf0SEzhTepSIPriEY2kiqoS-ss'),
            ('破茧思维进化','MS4wLjABAAAApFmp5zKucfUKMuFsOvYTa_qczFy2pSzvnI0NtYsIVvE'),
            ('灯下黑','MS4wLjABAAAAvYFLH2mCMSEu-j0iGgkhYq_k3o9n8av6n9W67mGyeDw'),
            ('一节心理课','MS4wLjABAAAAdYfc2YxNQZVn-j3FWhAQ8FIcG5JiXKcesweTa_ON6ZE'),
            ('森林心理','MS4wLjABAAAADZQWu__mECzbikseSgWY5mqYOeIApXsfK1W0L92cNo8p1_GoaE_vjPfscdHyj5Ub'),
            ('第十维度','MS4wLjABAAAA8g4s20zq6c-fb-vRAnIjQk5UqJhrF-Rof4L7a0_CcK7qXdzr8K-QZNfNKIhYDsJa'),
            ('认知进阶之路','MS4wLjABAAAAWlL1Iujnpt4IWDAWyWwSGcXduBb1ddGvJjXutQGX8h8'),
            ('如果书籍会说话','MS4wLjABAAAAWliHGH42wGMLNv0tHlaO11ijKTL2le_LHeJAH6p-YQE'),
          ])
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0'
          root=Path('candidate_visual'); root.mkdir(exist_ok=True)
          out={}

          async def cookie():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
              c=await b.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1000})
              pg=await c.new_page()
              try: await pg.goto('https://www.douyin.com/',wait_until='domcontentloaded',timeout=60000)
              except Exception: pass
              await pg.wait_for_timeout(8000)
              cs=await c.cookies(); await b.close()
              return '; '.join(f"{x['name']}={x['value']}" for x in cs if x.get('name'))

          def url_from(obj):
            if not isinstance(obj,dict): return None
            ul=obj.get('url_list') or obj.get('url_list_265') or []
            return ul[0] if ul else None

          async def main():
            ck=await cookie()
            kw={'headers':{'User-Agent':UA,'Referer':'https://www.douyin.com/'},'proxies':{'http://':None,'https://':None},'timeout':1,'cookie':ck}
            h=DouyinHandler(kw)
            with httpx.Client(headers={'User-Agent':UA,'Referer':'https://www.douyin.com/'},timeout=40,follow_redirects=True) as client:
              for name,sec in candidates.items():
                posts=[]
                try:
                  async for batch in h.fetch_user_post_videos(sec,0,0,10,10):
                    try: raw=batch._to_raw()
                    except Exception:
                      try: raw=batch._to_dict()
                      except Exception: raw=[]
                    xs=raw if isinstance(raw,list) else (raw.get('aweme_list') if isinstance(raw,dict) and isinstance(raw.get('aweme_list'),list) else [])
                    for x in xs:
                      if not isinstance(x,dict): continue
                      v=x.get('video') or {}
                      cover=url_from(v.get('cover')) or url_from(v.get('origin_cover')) or url_from(v.get('dynamic_cover'))
                      st=x.get('statistics') or {}
                      posts.append({'aweme_id':str(x.get('aweme_id') or ''),'desc':x.get('desc') or '', 'likes':st.get('digg_count'),'cover':cover})
                    break
                except Exception as e:
                  out[name]={'error':f'{type(e).__name__}: {e}'}; continue
                out[name]={'sec_uid':sec,'posts':posts[:8]}
                thumbs=[]
                for i,pst in enumerate(posts[:8]):
                  if not pst['cover']: continue
                  try:
                    r=client.get(pst['cover']); r.raise_for_status()
                    im=Image.open(BytesIO(r.content)).convert('RGB')
                    im=ImageOps.fit(im,(270,480))
                    dr=ImageDraw.Draw(im); dr.rectangle((0,0,270,52),fill='black'); dr.text((8,5),f'{i+1}  likes:{pst["likes"]}',fill='white');
                    thumbs.append(im)
                    im.save(root/f'{name}_{i+1}.jpg',quality=82)
                  except Exception as e: pass
                if thumbs:
                  cols=4; rows=(len(thumbs)+3)//4
                  sheet=Image.new('RGB',(cols*270,rows*480),'black')
                  for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*270,(i//4)*480))
                  sheet.save(root/f'sheet_{name}.jpg',quality=82)
                print('\n###',name,'posts',len(posts))
                for p in posts[:8]: print(p['likes'],p['desc'][:120],p['cover'][:80] if p['cover'] else None)
            (root/'metadata.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-candidate-visual
          path: candidate_visual/
          if-no-files-found: warn
