name: tmp-douyin-hq-only
on:
  push:
    branches: [tmp/douyin-hq-only-20260819]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          mkdir -p output/douyin-hq
          echo "$GITHUB_RUN_ID" > output/douyin-hq/run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/douyin-hq/run_id.txt
          git commit -m 'chore: expose douyin hq run id [skip ci]' || true
          git push || true
      - name: Download already-resolved main video URL
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Version/17.5 Mobile/15E148 Safari/604.1'
          u='https://v3-dy-o.zjcdn.com/c7dc140a0186ea4ccfe7e8a41343938f/6a84db57/video/tos/cn/tos-cn-v-0015c001/oIGD03FQETejIMFAUG5AKr6fTyr7CfB8zIBzq1/?a=0&ch=0&cr=4&dr=0&lr=unwatermarked&net=5&cd=0%7C0%7C0%7C4&cv=1&br=8977&bt=8977&cs=0&ds=4&ft=4zvy_jw~9wUxRYgWzM6~OiXnumLjBICttPskag3-I_kaY3&mime_type=video_mp4&qs=13&rc=M3Zvd285cnF3PDMzNGkzM0BpM3Zvd285cnF3PDMzNGkzM0BxaTVoMmRzYHBhLS1kLTBzYSNxaTVoMmRzYHBhLS1kLTBzcw%3D%3D&btag=80000e00028000&cc=1f&cquery=106H&dy_q=1787088087&l=202608190521275C76ACB68B69D5CC0BC0%2C202608190521275C76ACB68B69D5CC0BC0&req_cdn_type='
          out=Path('output/douyin-hq'); out.mkdir(parents=True,exist_ok=True)
          dest=out/'梦马思考_拉普拉斯变换_HQ.mp4'
          req=urllib.request.Request(u,headers={'User-Agent':ua,'Referer':'https://www.douyin.com/','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=120) as r, open(dest,'wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b: break
              f.write(b)
          print('downloaded',dest.stat().st_size)
          PY
          ffprobe -hide_banner output/douyin-hq/梦马思考_拉普拉斯变换_HQ.mp4 2>&1 | tee output/douyin-hq/ffprobe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-hq-reference
          path: output/douyin-hq/
          retention-days: 3
