name: tmp-soft-question-auditions
on:
  push:
    branches: [tmp/soft-question-auditions-20260818]
permissions:
  contents: write
jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[skip soft q]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          mkdir -p output/soft-question-auditions
          echo "$GITHUB_RUN_ID" > output/soft-question-auditions/run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/soft-question-auditions/run_id.txt
          git commit -m 'chore: expose soft question run id [skip soft q]' || true
          git push || true
      - name: Download auditions
        run: |
          mkdir -p output/soft-question-auditions
          curl -fL 'https://resource2.heygen.ai/text_to_speech/63ecaa32595043c7b416b4f407a482c2/1c651b8254304a298f6f35585f2e1d04/id=1bc8b98f-3d97-4e06-afa2-2eacfb886b2e.wav' -o 'output/soft-question-auditions/Q1_轻柔自然.wav'
          curl -fL 'https://resource2.heygen.ai/text_to_speech/63ecaa32595043c7b416b4f407a482c2/788cd5ac4afe4f88a88c86feafebf88e/id=95a4c261-c822-4953-9d29-0ea15575bd77.wav' -o 'output/soft-question-auditions/Q2_柔和偏轻.wav'
          curl -fL 'https://resource2.heygen.ai/text_to_speech/63ecaa32595043c7b416b4f407a482c2/45d1bc0c65e9426b9da4327d52e1f346/id=13e32274-4df0-43f6-969e-2c0b8581b8d1.wav' -o 'output/soft-question-auditions/Q3_更慢更柔.wav'
          curl -fL 'https://resource2.heygen.ai/text_to_speech/63ecaa32595043c7b416b4f407a482c2/bb2850ee8c76464d8e3d43f51b963fd1/id=42367f7f-b4bb-4380-96b8-13be6efae08c.wav' -o 'output/soft-question-auditions/Q4_柔和有质感.wav'
          ls -lh output/soft-question-auditions
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soft-question-auditions
          path: output/soft-question-auditions/
