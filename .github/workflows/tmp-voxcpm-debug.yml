name: tmp-voxcpm-debug
on:
  push:
    branches: [tmp/voxcpm-ggbond-audition-20260818]
permissions:
  contents: write
jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, '[skip voxcpm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client
        continue-on-error: true
        run: pip install -U gradio_client
      - name: Run VoxCPM
        continue-on-error: true
        run: |
          mkdir -p output/voxcpm-debug refs
          python - <<'PY'
          import base64, shutil, traceback
          from pathlib import Path
          status=Path('output/voxcpm-debug/status.txt')
          b64=''''''
          try:
              from gradio_client import Client, handle_file
              ref=Path('refs/ggbond.mp3'); ref.write_bytes(base64.b64decode(b64))
              client=Client('OpenBMB/VoxCPM-Demo', verbose=False)
              out=client.predict('当然不对。真正的问题，是你把系统推得太接近满负荷了。','',handle_file(str(ref)),False,'',2.2,False,True,12,api_name='/generate')
              src=out[0] if isinstance(out,(tuple,list)) else out
              src=getattr(src,'path',src)
              shutil.copy2(str(src),'output/voxcpm-debug/clone.wav')
              status.write_text('SUCCESS\n'+repr(out),encoding='utf-8')
          except Exception:
              status.write_text('FAILED\n'+traceback.format_exc(),encoding='utf-8')
          PY
      - name: Commit debug result
        if: always()
        run: |
          mkdir -p output/voxcpm-debug
          test -f output/voxcpm-debug/status.txt || echo 'FAILED BEFORE PYTHON' > output/voxcpm-debug/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-debug
          git commit -m 'chore: VoxCPM debug result [skip voxcpm]' || true
          git push || true
