name: tmp-voxcpm-cpu2
on:
  push:
    branches: [tmp/voxcpm-cpu2-20260818]
permissions:
  contents: write
jobs:
  clone:
    if: ${{ !contains(github.event.head_commit.message, '[skip cpu2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and report
        run: |
          mkdir -p output/voxcpm-cpu2
          set +e
          pip install -U voxcpm soundfile > output/voxcpm-cpu2/install.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then echo INSTALL_OK > output/voxcpm-cpu2/status.txt; else echo INSTALL_FAILED:$RC > output/voxcpm-cpu2/status.txt; tail -80 output/voxcpm-cpu2/install.log >> output/voxcpm-cpu2/status.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-cpu2/status.txt output/voxcpm-cpu2/install.log
          git commit -m 'chore: CPU2 install status [skip cpu2]' || true
          git push || true
          exit $RC
      - name: Generate stronger answer clones
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, traceback
          status=Path('output/voxcpm-cpu2/status.txt')
          try:
            src=Path('.github/workflows/tmp-voxcpm-debug.yml').read_text(encoding='utf-8')
            m=re.search(r"b64='''([^']+)'''",src,re.S)
            if not m:
                raise RuntimeError('reference base64 not found')
            Path('reference.mp3').write_bytes(base64.b64decode(m.group(1)))

            import numpy as np
            import soundfile as sf
            ref_data, ref_sr = sf.read('reference.mp3', dtype='float32', always_2d=True)
            if ref_data.shape[1] > 1:
                ref_data = ref_data.mean(axis=1, keepdims=True)
            total = len(ref_data) / ref_sr
            def crop_tail(sec, out):
                start = max(0, int((total-sec)*ref_sr))
                sf.write(out, ref_data[start:], ref_sr, subtype='PCM_16')
            crop_tail(2.8, 'answer_ref_A.wav')
            crop_tail(2.2, 'answer_ref_B.wav')

            import torch, torchaudio
            def soundfile_load(path, *args, **kwargs):
                data, sr = sf.read(str(path), dtype='float32', always_2d=True)
                return torch.from_numpy(np.asarray(data).T.copy()), sr
            torchaudio.load = soundfile_load

            from voxcpm import VoxCPM
            status.write_text('LOADING_MODEL',encoding='utf-8')
            model=VoxCPM.from_pretrained(
                'openbmb/VoxCPM-0.5B',
                load_denoiser=False,
                optimize=False,
                device='cpu'
            )
            target='当然不对。你有没有发现一个很奇怪的事？有时候一天只安排三四件事，反而全做完了。'
            status.write_text('GENERATING_A',encoding='utf-8')
            wavA=model.generate(
                text=target,
                prompt_wav_path='answer_ref_A.wav',
                prompt_text='对吗？当然不对了。',
                cfg_value=2.2,
                inference_timesteps=4,
                normalize=False,
                denoise=False,
                retry_badcase=False,
            )
            sf.write('output/voxcpm-cpu2/answer_A_强势解释.wav',wavA,model.tts_model.sample_rate)

            status.write_text('GENERATING_B',encoding='utf-8')
            wavB=model.generate(
                text='当然不对。真正的问题，是你把系统推得太接近满负荷了。',
                prompt_wav_path='answer_ref_B.wav',
                prompt_text='当然不对了。',
                cfg_value=2.4,
                inference_timesteps=4,
                normalize=False,
                denoise=False,
                retry_badcase=False,
            )
            sf.write('output/voxcpm-cpu2/answer_B_更短促强势.wav',wavB,model.tts_model.sample_rate)
            status.write_text('SUCCESS_ANSWER',encoding='utf-8')
          except Exception:
            status.write_text('FAILED\n'+traceback.format_exc(),encoding='utf-8')
          PY
      - name: Commit final result
        if: always()
        run: |
          git pull --rebase || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-cpu2
          git commit -m 'chore: stronger VoxCPM answer auditions [skip cpu2]' || true
          git push || true
