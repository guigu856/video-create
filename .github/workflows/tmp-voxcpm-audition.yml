name: tmp-voxcpm-audition
on:
  push:
    branches: [tmp/voxcpm-clone-audition-20260818]
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate VoxCPM clone auditions
        run: |
          pip install -U gradio_client
          mkdir -p output/voxcpm-auditions refs
          python - <<'PY'
          import base64, shutil, json
          from pathlib import Path
          from gradio_client import Client, handle_file

          refs = {
            'banana': '''''',
            'ggbond': '''''',
            'unfinished': '''''',
          }

          for name, b64 in refs.items():
              Path(f'refs/{name}.mp3').write_bytes(base64.b64decode(b64))

          client = Client('OpenBMB/VoxCPM-Demo', verbose=False)
          target = '当然不对。真正的问题，是你把系统推得太接近满负荷了。'
          results=[]
          for name in ['banana','ggbond','unfinished']:
              try:
                  out = client.predict(
                      target,
                      '',
                      handle_file(f'refs/{name}.mp3'),
                      False,
                      '',
                      2.2,
                      False,
                      True,
                      12,
                      api_name='/generate',
                  )
                  src = out[0] if isinstance(out,(tuple,list)) else out
                  src = getattr(src, 'path', src)
                  dst = Path('output/voxcpm-auditions') / f'{name}_clone.wav'
                  shutil.copy2(str(src), dst)
                  results.append({'name':name,'file':dst.name,'status':'ok'})
                  print('SAVED', dst)
              except Exception as e:
                  results.append({'name':name,'error':repr(e)})
                  print('FAILED', name, repr(e))
          Path('output/voxcpm-auditions/index.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload auditions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxcpm-clone-auditions
          path: output/voxcpm-auditions/
          if-no-files-found: warn
          retention-days: 7
