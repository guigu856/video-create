name: tmp-capcut-female-tts
on:
  push:
    branches: [tmp/capcut-female-tts-20260818]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect current response fields
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/K07VN/capcut-tts-api.git /tmp/capcut
          pip install requests
          mkdir -p output/capcut-debug
          cd /tmp/capcut
          python - <<'PY'
          import json,time,os
          from pathlib import Path
          from capcut_tts_api import CapCutClient
          out=Path(os.environ['GITHUB_WORKSPACE'])/'output'/'capcut-debug'
          c=CapCutClient()
          text='把每天的时间安排得越满，效率就越高，对吗？不对。真正高效的系统，必须给意外留出余量。'
          res=c.create_tts_task(texts=text,voice='zh_female_inspirational',resource_id='7473013595417088528',rate='1.0')
          print('CREATE=',json.dumps(res,ensure_ascii=False,indent=2))
          (out/'create.json').write_text(json.dumps(res,ensure_ascii=False,indent=2),encoding='utf-8')
          tasks=(res.get('data') or {}).get('tasks') or []
          if tasks:
            tid=tasks[0].get('id'); token=tasks[0].get('token'); print('TASK',tid,token)
            history=[]
            for i in range(12):
              time.sleep(2)
              q=c.query_tts_task(tid,token)
              history.append(q)
              print('QUERY',i,json.dumps(q,ensure_ascii=False))
            (out/'queries.json').write_text(json.dumps(history,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: capcut-tts-debug
          path: output/capcut-debug/
          retention-days: 7
