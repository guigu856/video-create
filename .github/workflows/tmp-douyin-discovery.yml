name: tmp-douyin-discovery

on:
  push:
    branches:
      - tmp/douyin-account-research-20260817

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Search Douyin users
        run: |
          python - <<'PY'
          import asyncio, json, urllib.parse
          from pathlib import Path
          from playwright.async_api import async_playwright

          keywords = ['人生算法','心理学效应','博弈论 人生','概率 人生','认知科学','数学 人生','底层逻辑 人生']
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          out={}

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
              context=await browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1200})
              page=await context.new_page()
              for kw in keywords:
                url='https://www.douyin.com/search/'+urllib.parse.quote(kw)+'?type=user'
                try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(8000)
                  for _ in range(4):
                    await page.mouse.wheel(0,1800)
                    await page.wait_for_timeout(1500)
                  items=await page.locator('a[href*="/user/"]').evaluate_all('''els => els.map(a => ({href:a.href,text:(a.innerText||a.textContent||'').trim()}))''')
                  seen=set(); cleaned=[]
                  for it in items:
                    href=(it.get('href') or '').split('?')[0]
                    if '/user/' not in href or href in seen: continue
                    seen.add(href)
                    text=' '.join((it.get('text') or '').split())[:300]
                    cleaned.append({'href':href,'text':text})
                  out[kw]=cleaned[:50]
                  print('\n###',kw,len(cleaned))
                  for x in cleaned[:20]: print(x)
                except Exception as e:
                  out[kw]={'error':f'{type(e).__name__}: {e}'}
              await browser.close()

          asyncio.run(main())
          Path('douyin_discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: douyin-discovery
          path: douyin_discovery.json
