name: tmp-extract-bgm-y7j

on:
  push:
    branches:
      - tmp/extract-bgm-y7j-20260818

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader deps
        run: |
          python -m pip install --upgrade pip
          pip install 'httpx>=0.27,<1' 'playwright>=1.60,<2' 'yt-dlp>=2026.6.9'
          python -m playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Download Douyin video and extract audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/bgm
          python -m components.video_download 'https://v.douyin.com/Y7J_RW9U4ko/' --output-dir output/source | tee output/download-result.json
          VIDEO_FILE="$(find output/source -maxdepth 1 -type f | head -n 1)"
          test -n "$VIDEO_FILE"
          echo "source=$VIDEO_FILE"
          ffmpeg -y -loglevel error -i "$VIDEO_FILE" -vn -c:a copy output/bgm/春娇与志明_抖音原始音轨.m4a || \
            ffmpeg -y -loglevel error -i "$VIDEO_FILE" -vn -c:a aac -b:a 256k output/bgm/春娇与志明_抖音原始音轨.m4a
          ffmpeg -y -loglevel error -i "$VIDEO_FILE" -vn -c:a libmp3lame -b:a 320k output/bgm/春娇与志明_BGM_320k.mp3
          ffprobe -v error -show_entries format=duration:stream=codec_name,channels,sample_rate -of json output/bgm/春娇与志明_BGM_320k.mp3 > output/bgm/audio-info.json
          ls -lh output/bgm/
      - name: Upload BGM
        uses: actions/upload-artifact@v4
        with:
          name: douyin-bgm-y7j
          path: output/bgm/
          if-no-files-found: error
          retention-days: 7
