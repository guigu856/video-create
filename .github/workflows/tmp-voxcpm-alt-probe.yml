name: tmp-voxcpm-alt-probe
on:
  push:
    branches: [tmp/voxcpm-ggbond-audition-20260818]
permissions:
  contents: write
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[skip voxcpm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -U gradio_client
      - name: Probe
        continue-on-error: true
        run: |
          mkdir -p output/voxcpm-alt
          python - <<'PY'
          from pathlib import Path
          import traceback
          try:
            from gradio_client import Client
            c=Client('sanaye/VOXFree', verbose=False)
            info=c.view_api(return_format='dict', print_info=False)
            Path('output/voxcpm-alt/api.txt').write_text(repr(info),encoding='utf-8')
          except Exception:
            Path('output/voxcpm-alt/api.txt').write_text(traceback.format_exc(),encoding='utf-8')
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-alt/api.txt
          git commit -m 'chore: alternate VoxCPM API probe [skip voxcpm]' || true
          git push || true
