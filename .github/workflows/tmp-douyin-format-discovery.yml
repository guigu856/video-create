name: tmp-douyin-format-discovery

on:
  push:
    branches:
      - tmp/douyin-account-research-20260817

permissions:
  contents: read

jobs:
  discover-format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Discover format accounts
        run: |
          python - <<'PY'
          import asyncio, json, urllib.parse
          from pathlib import Path
          from playwright.async_api import async_playwright

          queries=[
            '对吗 不对 心理学','对吗 不对 人生','对吗 不对 效应',
            '柯南 心理学','柯南 人生法则','猪猪侠 心理学','猪猪侠 人生',
            '蕉太狼 心理学','蕉太狼 人生','动画 心理学 人生','动画IP 人生法则'
          ]
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          out={}
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
              ctx=await browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1200})
              page=await ctx.new_page()
              for q in queries:
                try:
                  url='https://www.douyin.com/search/'+urllib.parse.quote(q)
                  await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(7000)
                  for _ in range(3):
                    await page.mouse.wheel(0,1800); await page.wait_for_timeout(1200)
                  users=await page.locator('a[href*="/user/"]').evaluate_all('''els => els.map(a => ({href:a.href,text:(a.innerText||a.textContent||'').trim()}))''')
                  videos=await page.locator('a[href*="/video/"]').evaluate_all('''els => els.map(a => ({href:a.href,text:(a.innerText||a.textContent||'').trim()}))''')
                  def clean(items,needle):
                    seen=set(); arr=[]
                    for it in items:
                      h=(it.get('href') or '').split('?')[0]
                      if needle not in h or h in seen: continue
                      seen.add(h); arr.append({'href':h,'text':' '.join((it.get('text') or '').split())[:500]})
                    return arr
                  out[q]={'users':clean(users,'/user/')[:40],'videos':clean(videos,'/video/')[:40]}
                  print('\n###',q)
                  for x in out[q]['users'][:15]: print('USER',x)
                  for x in out[q]['videos'][:8]: print('VIDEO',x)
                except Exception as e:
                  out[q]={'error':f'{type(e).__name__}: {e}'}
              await browser.close()
          asyncio.run(main())
          Path('douyin_format_discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: douyin-format-discovery
          path: douyin_format_discovery.json
