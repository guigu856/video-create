name: tmp-voxcpm-ggbond
on:
  push:
    branches: [tmp/voxcpm-ggbond-audition-20260818]
permissions:
  contents: write
jobs:
  audition:
    if: ${{ !contains(github.event.head_commit.message, '[skip voxcpm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate VoxCPM auditions
        run: |
          pip install -U gradio_client
          mkdir -p refs output/voxcpm-ggbond
          python - <<'PY'
          import base64, shutil
          from pathlib import Path
          from gradio_client import Client, handle_file
          b64=''''''
          ref=Path('refs/ggbond.mp3'); ref.write_bytes(base64.b64decode(b64))
          client=Client('OpenBMB/VoxCPM-Demo', verbose=False)
          cases=[
            ('01_clone','当然不对。真正的问题，是你把系统推得太接近满负荷了。',''),
            ('02_stronger','当然不对。真正的问题，是你把系统推得太接近满负荷了。','语气更坚定、更有压迫感，语速自然，开头“当然不对”短促有力，不要喊叫'),
          ]
          for name,text,control in cases:
            out=client.predict(text,control,handle_file(str(ref)),False,'',2.2,False,True,12,api_name='/generate')
            src=out[0] if isinstance(out,(tuple,list)) else out
            src=getattr(src,'path',src)
            shutil.copy2(str(src),f'output/voxcpm-ggbond/{name}.wav')
          PY
      - name: Commit auditions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/voxcpm-ggbond/*.wav
          git commit -m 'chore: add VoxCPM audition outputs [skip voxcpm]'
          git push
