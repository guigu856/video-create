name: tmp-mambo-hfspace
on:
  push:
    branches: [tmp/mambo-hfspace-20260819]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish run id
        run: |
          mkdir -p output/mambo-hfspace
          echo "$GITHUB_RUN_ID" > output/mambo-hfspace/run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/mambo-hfspace/run_id.txt
          git commit -m 'chore: expose mambo hfspace run id [skip ci]' || true
          git push || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gradio client
        run: python -m pip install -q --upgrade gradio_client
      - name: Generate Mambo audition on hosted GPT-SoVITS
        run: |
          set -euxo pipefail
          mkdir -p output/mambo-hfspace
          curl -fL 'https://raw.githubusercontent.com/Tsukimisaka/MamboTTS/main/models/refer.wav' -o /tmp/refer.wav
          python - <<'PY'
          from gradio_client import Client, handle_file
          import shutil, os, traceback
          client = Client('lj1995/GPT-SoVITS-ProPlus')
          try:
              print(client.view_api(return_format='dict'))
          except Exception as e:
              print('view_api failed:',repr(e))
          args = [
              handle_file('/tmp/refer.wav'),
              '大家好，欢迎来到我的频道，今天给大家分享一个有趣的内容',
              '中文',
              '当然不对。数学里有一个很经典的随机过程，叫做马尔可夫链。马尔可夫链由一组状态，以及这些状态之间的转移概率构成。假设一个系统现在处于某个状态。下一步进入另一个状态的概率，可以这样表示。',
              '中文',
              '按标点符号切',
              15,
              1.0,
              1.0,
              False,
              1.0,
              False,
              [],
          ]
          result=None
          errors=[]
          for api_name in ['/get_tts_wav','/predict']:
              try:
                  print('TRY',api_name)
                  result=client.predict(*args, api_name=api_name)
                  print('RESULT',result)
                  break
              except Exception as e:
                  errors.append((api_name,repr(e)))
                  traceback.print_exc()
          if result is None:
              raise SystemExit('all endpoints failed: '+repr(errors))
          if isinstance(result,(list,tuple)):
              result=result[0]
          if isinstance(result,dict):
              result=result.get('path') or result.get('name') or result.get('url')
          if not result or not os.path.exists(result):
              raise SystemExit('no local result file: '+repr(result))
          out=os.path.join(os.environ['GITHUB_WORKSPACE'],'output/mambo-hfspace/曼波_马尔可夫链_正文测试_快速版.wav')
          shutil.copy2(result,out)
          print('saved',out,os.path.getsize(out))
          PY
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 'output/mambo-hfspace/曼波_马尔可夫链_正文测试_快速版.wav'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mambo-markov-hfspace-audition
          path: output/mambo-hfspace/
          retention-days: 3
