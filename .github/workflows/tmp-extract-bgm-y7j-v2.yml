name: tmp-extract-bgm-y7j-v2

on:
  push:
    branches:
      - tmp/extract-bgm-y7j-20260818

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install 'git+https://github.com/Johnserf-Seed/f2.git@main' httpx playwright
          python -m playwright install chromium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Resolve and download
        run: |
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          import httpx
          from playwright.async_api import async_playwright
          from f2.apps.douyin.handler import DouyinHandler
          SHARE='https://v.douyin.com/Y7J_RW9U4ko/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          root=Path('output'); src=root/'source'; bgm=root/'bgm'; src.mkdir(parents=True,exist_ok=True); bgm.mkdir(parents=True,exist_ok=True)
          def find_aweme(raw):
              if not isinstance(raw,dict): return {}
              if isinstance(raw.get('aweme_detail'),dict): return raw['aweme_detail']
              if isinstance(raw.get('aweme_list'),list) and raw['aweme_list']: return raw['aweme_list'][0]
              if isinstance(raw.get('item_list'),list) and raw['item_list']: return raw['item_list'][0]
              if isinstance(raw.get('data'),dict):
                  hit=find_aweme(raw['data'])
                  if hit: return hit
              return raw if 'aweme_id' in raw else {}
          async def main():
              resolved=''; cookie=''
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
                  c=await b.new_context(user_agent=UA,locale='zh-CN')
                  page=await c.new_page()
                  try: await page.goto(SHARE,wait_until='domcontentloaded',timeout=30000)
                  except Exception: pass
                  resolved=page.url
                  try:
                      await page.goto('https://www.douyin.com/',wait_until='domcontentloaded',timeout=30000)
                      await page.wait_for_timeout(2500)
                  except Exception: pass
                  cs=await c.cookies(); cookie='; '.join(f"{x['name']}={x['value']}" for x in cs if x.get('name'))
                  await b.close()
              print('resolved=',resolved)
              m=re.search(r'/video/(\d+)',resolved or '') or re.search(r'(?:modal_id|aweme_id)=(\d+)',resolved or '')
              if not m:
                  async with httpx.AsyncClient(headers={'User-Agent':UA},follow_redirects=True,timeout=30) as hc:
                      r=await hc.get(SHARE); print('http_resolved=',r.url)
                      m=re.search(r'/video/(\d+)',str(r.url)) or re.search(r'(?:modal_id|aweme_id)=(\d+)',str(r.url)) or re.search(r'"aweme_id"\s*:\s*"?(\d+)',r.text)
              if not m: raise RuntimeError('cannot resolve aweme id')
              aid=m.group(1); print('aweme_id=',aid)
              h=DouyinHandler({'headers':{'User-Agent':UA,'Referer':'https://www.douyin.com/'},'proxies':{'http://':None,'https://':None},'timeout':30,'cookie':cookie})
              v=await h.fetch_one_video(aid); aw=find_aweme(v._to_raw())
              if not aw: raise RuntimeError('empty aweme detail')
              video=aw.get('video') or {}; urls=[]
              for key in ('play_addr','play_addr_h265','download_addr'):
                  for u in ((video.get(key) or {}).get('url_list') or []):
                      if u and u not in urls: urls.append(u)
              if not urls: raise RuntimeError('no video url')
              headers={'User-Agent':UA,'Referer':'https://www.douyin.com/'}
              async with httpx.AsyncClient(headers=headers,follow_redirects=True,timeout=90) as hc:
                  for u in urls:
                      try:
                          r=await hc.get(u); r.raise_for_status()
                          if len(r.content)>100000:
                              (src/'source.mp4').write_bytes(r.content); break
                      except Exception: pass
                  else: raise RuntimeError('video download failed')
                  music=aw.get('music') or {}
                  for k in ('play_url','play_url_hq'):
                      for u in ((music.get(k) or {}).get('url_list') or []):
                          try:
                              r=await hc.get(u); r.raise_for_status()
                              if len(r.content)>10000:
                                  (bgm/'抖音_music_原声.mp3').write_bytes(r.content); raise StopAsyncIteration
                          except StopAsyncIteration: raise
                          except Exception: pass
              meta={'aweme_id':aid,'desc':aw.get('desc'),'author':(aw.get('author') or {}).get('nickname'),'music_title':(aw.get('music') or {}).get('title'),'music_author':(aw.get('music') or {}).get('author'),'music_id':(aw.get('music') or {}).get('id')}
              (root/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          try:
              asyncio.run(main())
          except StopAsyncIteration:
              pass
          PY
      - name: Extract audio
        run: |
          set -e
          mkdir -p output/bgm
          ffmpeg -y -loglevel error -i output/source/source.mp4 -vn -c:a copy output/bgm/春娇与志明_视频原始音轨.m4a || ffmpeg -y -loglevel error -i output/source/source.mp4 -vn -c:a aac -b:a 256k output/bgm/春娇与志明_视频原始音轨.m4a
          ffmpeg -y -loglevel error -i output/source/source.mp4 -vn -c:a libmp3lame -b:a 320k output/bgm/春娇与志明_BGM_320k.mp3
          ffprobe -v error -show_entries format=duration:stream=codec_name,channels,sample_rate -of json output/bgm/春娇与志明_BGM_320k.mp3 > output/bgm/audio-info.json
          cp output/meta.json output/bgm/meta.json || true
          ls -lh output/bgm/
      - uses: actions/upload-artifact@v4
        with:
          name: douyin-bgm-y7j-v2
          path: output/bgm/
          if-no-files-found: error
          retention-days: 7
