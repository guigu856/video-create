name: tmp-chatgpt-share-extract

on:
  push:
    branches:
      - tmp/chatgpt-share-extract-20260818

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Extract shared conversation
        run: |
          mkdir -p tmp_chatgpt_share
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL='https://chatgpt.com/share/6a8408dd-1ce0-83ea-8496-806315a7be88'
          root=Path('tmp_chatgpt_share')

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              ctx=await browser.new_context(
                viewport={'width':1440,'height':1200},
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
                locale='zh-CN'
              )
              page=await ctx.new_page()
              await page.goto(URL,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(12000)
              # Scroll both directions to force rendering of a long shared chat.
              for _ in range(20):
                await page.mouse.wheel(0,3500)
                await page.wait_for_timeout(600)
              await page.evaluate('window.scrollTo(0,0)')
              await page.wait_for_timeout(1500)
              title=await page.title()
              final_url=page.url
              text=await page.locator('body').inner_text()
              html=await page.content()
              (root/'share_title.txt').write_text(title,encoding='utf-8')
              (root/'share_url.txt').write_text(final_url,encoding='utf-8')
              (root/'share_body.txt').write_text(text,encoding='utf-8')
              (root/'share_page.html').write_text(html,encoding='utf-8')
              await page.screenshot(path=str(root/'share_page.png'),full_page=True)
              print('TITLE:',title)
              print('URL:',final_url)
              print('BODY_LEN:',len(text))
              print(text[:40000])
              await browser.close()
          asyncio.run(main())
          PY
      - name: Persist extracted text on temporary branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_chatgpt_share/share_body.txt tmp_chatgpt_share/share_title.txt tmp_chatgpt_share/share_url.txt tmp_chatgpt_share/share_page.html || true
          git diff --cached --quiet || git commit -m "chore: persist temporary ChatGPT share extraction"
          git push origin HEAD:tmp/chatgpt-share-extract-20260818
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share-extract
          path: tmp_chatgpt_share/
          if-no-files-found: warn
