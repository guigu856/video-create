name: tmp-chatgpt-share-extract

on:
  push:
    branches:
      - tmp/chatgpt-share-extract-20260818

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Extract shared conversation
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          URL='https://chatgpt.com/share/6a8408dd-1ce0-83ea-8496-806315a7be88'

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              ctx=await browser.new_context(
                viewport={'width':1440,'height':1200},
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
                locale='zh-CN'
              )
              page=await ctx.new_page()
              await page.goto(URL,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(12000)
              # Scroll through the full shared conversation to trigger any lazy rendering.
              for _ in range(15):
                await page.mouse.wheel(0,3000)
                await page.wait_for_timeout(700)
              title=await page.title()
              url=page.url
              text=await page.locator('body').inner_text()
              html=await page.content()
              Path('share_title.txt').write_text(title,encoding='utf-8')
              Path('share_url.txt').write_text(url,encoding='utf-8')
              Path('share_body.txt').write_text(text,encoding='utf-8')
              Path('share_page.html').write_text(html,encoding='utf-8')
              await page.screenshot(path='share_page.png',full_page=True)
              print('TITLE:',title)
              print('URL:',url)
              print('BODY_LEN:',len(text))
              print(text[:30000])
              await browser.close()
          asyncio.run(main())
          PY
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share-extract
          path: |
            share_title.txt
            share_url.txt
            share_body.txt
            share_page.html
            share_page.png
          if-no-files-found: warn
