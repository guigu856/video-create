name: tmp-douyin-ssr-search

on:
  push:
    branches:
      - tmp/douyin-account-research-20260817

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and inspect SSR search HTML
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re, html, json
          queries=['猪猪侠 心理学 人生','蕉太狼 心理学 人生','柯南 心理学 人生','对吗 当然不对 心理学']
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          result={}
          for q in queries:
            url='https://www.douyin.com/search/'+urllib.parse.quote(q)
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9'})
            try:
              body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
            except Exception as e:
              result[q]={'error':str(e)}; continue
            d={'bytes':len(body),'contains_query':q in body}
            # collect obvious video/user paths anywhere in SSR HTML/scripts
            vids=list(dict.fromkeys(re.findall(r'(?:https?:\\?/\\?/www\.douyin\.com)?\\?/video\\?/([0-9]{10,})',body)))
            users=list(dict.fromkeys(re.findall(r'(?:https?:\\?/\\?/www\.douyin\.com)?\\?/user\\?/([A-Za-z0-9_-]{20,})',body)))
            d['video_ids']=vids[:100]; d['sec_users']=users[:100]
            for needle in ['猪猪侠','蕉太狼','柯南','心理学','当然不对','不对','aweme_id','nickname','sec_uid','search_result']:
              pos=body.find(needle)
              if pos>=0: d['around_'+needle]=html.unescape(body[max(0,pos-600):pos+1200])
            # Decode common escaped unicode for targeted words, search again
            try:
              decoded=bytes(body,'utf-8').decode('unicode_escape','ignore')
            except Exception: decoded=''
            for needle in ['猪猪侠','蕉太狼','柯南','当然不对','aweme_id','nickname','sec_uid']:
              pos=decoded.find(needle)
              if pos>=0: d['decoded_around_'+needle]=decoded[max(0,pos-600):pos+1200]
            result[q]=d
            print('\n###',q,'bytes',len(body),'videos',len(vids),'users',len(users))
            print('video_ids',vids[:20])
            print('users',users[:10])
            for k,v in d.items():
              if k.startswith('around_') or k.startswith('decoded_around_'):
                print('\n',k,repr(v[:900]))
          open('douyin_ssr_search.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: douyin-ssr-search
          path: douyin_ssr_search.json
